# =============================================================================
# NormInvoice — Production Docker Compose (Hetzner Germany / EU-Central)
# Security: einvoice-engine & kosit-validator live on internal zero-egress VPC
# =============================================================================
services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain Caddy requests the TLS certificate for (resolved from the root .env).
      # Without this the Caddyfile falls back to its default domain and ACME fails.
      - APP_DOMAIN=${APP_DOMAIN:-norminvoice.eu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public_edge
      - app_internal
    depends_on:
      - web-api

  web-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - SQLITE_DATA_DIR=/app/data
      - ENABLE_DEMO_LOGIN=false
      - EINVOICE_ENGINE_URL=http://einvoice-engine:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - web_data:/app/data
    networks:
      - app_internal
      - engine_sandbox
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
      einvoice-engine:
        # service_started (not _healthy): the app treats the engine as optional and
        # falls back to its built-in EN 16931 + PDF/A-3b core, so a slow or unhealthy
        # engine must never block the website from coming up.
        condition: service_started

  # NOTE: services/worker (BullMQ) is a roadmap scaffold — it is NOT wired into the live
  # invoice path and is intentionally not run here. Running it would also have two processes
  # writing the same SQLite file over a shared volume (corruption risk). When the worker is
  # wired in a future release, give it its own data access (or adopt the Postgres path) first.

  einvoice-engine:
    build:
      context: ../services/einvoice-engine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/ephemeral:rw,noexec,nosuid,nodev,size=256m
    environment:
      # kosit-validator disabled on ARM (upstream image is amd64-only); the engine
      # still runs Ghostscript PDF/A-3b + veraPDF, and the app's built-in EN 16931
      # core covers XRechnung schematron. Empty URL => engine skips the KoSIT call.
      - KOSIT_VALIDATOR_URL=
      - EINVOICE_ENGINE_SHARED_SECRET=${EINVOICE_ENGINE_SHARED_SECRET}
    networks:
      - engine_sandbox # Strictly internal: true (zero outbound internet egress)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  # kosit-validator (official KoSIT XRechnung daemon) is DISABLED on this ARM/Graviton
  # host: the upstream image apps4everything/kosit-validator-xrechnung is amd64-only and
  # crashes with exit 255 under ARM. The app falls back to its built-in deterministic
  # EN 16931 / XRechnung core. To restore the official validator later, run it on an x86
  # host (or an arm64 image) and point einvoice-engine's KOSIT_VALIDATOR_URL at it.

  # NOTE: This is a single-node SQLite MVP (see README + docs/PRODUCTION_AUDIT.md).
  # The source of truth is data/norminvoice.sqlite inside the web_data volume.
  # PostgreSQL is intentionally NOT run here. To adopt the Postgres/RLS scale path
  # (future Option B), re-add a postgres service, set DATABASE_URL, and migrate reads.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  public_edge:
    driver: bridge
  app_internal:
    driver: bridge
  engine_sandbox:
    driver: bridge
    internal: true # Zero internet egress for untrusted XML/PDF processing

volumes:
  web_data:
  redis_data:
  caddy_data:
  caddy_config:
