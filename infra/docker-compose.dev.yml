# Local Developer Infrastructure Stack (Redis 7 + KoSIT + Python PDF/A-3b Engine, plus optional Postgres)
# Run: docker compose -f infra/docker-compose.dev.yml up -d
# NOTE: The app's production store is SQLite (see README). Postgres below is OPTIONAL — only used
# if you set DATABASE_URL to experiment with the future Postgres/RLS scale path (Option B).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: norminvoice
      POSTGRES_USER: norminvoice
      POSTGRES_PASSWORD: dev_password_only
    volumes:
      - ../packages/db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kosit-validator:
    build:
      context: ../services/kosit-validator
    ports:
      - "8081:8081"

  einvoice-engine:
    build:
      context: ../services/einvoice-engine
    ports:
      - "8000:8000"
    environment:
      KOSIT_VALIDATOR_URL: http://kosit-validator:8081
    depends_on:
      - kosit-validator
